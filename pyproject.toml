[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-generation-service"
version = "0.1.0"
description = "Async LLM generation microservice. Enqueues Ollama+subprocess runs via Redis/RQ, retries on failure with error feedback, writes RunResults to Postgres."
requires-python = ">=3.11"
dependencies = [
    "automl-reusables @ git+https://github.com/Major-Proj-AutoML/automl-reusables.git@v0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "redis>=5.0",
    "rq>=1.16",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
